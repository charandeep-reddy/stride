:root{
  --ink:#1c1a1f;--cream:#f0e8e0;--dark:#191a1e;--flav:#ab9ac4;--rv:transparent;--g:rgba(148,189,180,.72);
  --ease:cubic-bezier(.22,.8,.24,1);
  --sheet:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261116_132032_30242d8c-5062-4d60-8a3d-238f0a2ff788.png&w=2200&q=85");
  --u:min(calc(100vw/1440),calc(100vh/900));
  --w:calc(100vw/1440);
  --n:min(calc(100vw/1440),1px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body.locked{overflow:hidden}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.disp{font-family:"Archivo Black",Inter,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.spr{background-image:var(--sheet);background-repeat:no-repeat}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:2;pointer-events:none}

/* ---------- nav ---------- */
#nav{--nh:calc(var(--n)*94);position:fixed;left:0;right:0;top:calc(var(--nh)*-1.1);z-index:50;height:var(--nh);padding:0 calc(var(--n)*37) 0 calc(var(--n)*42);display:flex;align-items:center;justify-content:space-between;color:var(--ink);transition:color .4s}
#nav.in{animation:navIn 900ms cubic-bezier(.22,.9,.24,1) forwards}
/* top (not transform): a transform would trap the fixed bottom pill on phones */
@keyframes navIn{from{top:calc(var(--nh)*-1.1)}to{top:0}}
.brand{display:flex;align-items:center;gap:calc(var(--n)*10);font-weight:800;font-size:calc(var(--n)*15.5);letter-spacing:.06em;text-decoration:none;color:inherit}
.mark{width:calc(var(--n)*36);height:calc(var(--n)*36);border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:background .4s}
.mark svg{width:60%;height:60%}
.mark path{fill:var(--cream);transition:fill .4s}
.pill{position:relative;display:flex;padding:calc(var(--n)*5);border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px}
.pill a{position:relative;z-index:1;padding:calc(var(--n)*9) calc(var(--n)*18);font-size:calc(var(--n)*14.5);font-weight:500;color:inherit;text-decoration:none;border-radius:99px;white-space:nowrap}
.pill a.on{font-weight:600}
.pill .hl{position:absolute;top:calc(var(--n)*5);bottom:calc(var(--n)*5);left:0;width:0;background:#fff;border-radius:99px;transition:left .5s var(--ease),width .5s var(--ease)}
#nav.light .pill{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
#nav.dark{color:var(--cream)}
#nav.dark .mark{background:var(--cream)}#nav.dark .mark path{fill:var(--ink)}
#nav.dark .pill{border-color:rgba(240,232,224,.25);background:rgba(255,255,255,.06)}
#nav.dark .pill .hl{background:rgba(240,232,224,.16)}
.right{display:flex;align-items:center;gap:calc(var(--n)*8)}
.chip{height:calc(var(--n)*37);display:inline-flex;align-items:center;justify-content:center;border:1.5px solid currentColor;border-radius:99px;padding:0 calc(var(--n)*14);font-size:calc(var(--n)*13);font-weight:600;color:inherit;background:none}
.chip.basket{position:relative;width:calc(var(--n)*44);padding:0}
.chip.basket svg{width:calc(var(--n)*18);height:calc(var(--n)*18)}
.badge{position:absolute;right:-6px;top:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--dark);color:#fff;font:500 10.5px/18px "DM Mono",monospace;text-align:center;display:none}
.badge.show{display:block}
.first{height:calc(var(--n)*37);padding:0 calc(var(--n)*18);border-radius:99px;background:var(--ink);color:#fff;font-size:calc(var(--n)*14.5);font-weight:600;display:inline-flex;align-items:center;text-decoration:none;transition:background .4s}
#nav.dark .first{background:#8fa8a3;color:var(--dark)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#ab9ac4;transition:opacity .5s}
#intro.hide{opacity:0;pointer-events:none}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro.logo{background:var(--cream)}
#intro.logo video{display:none}
#skip{position:absolute;top:calc(var(--u)*28);right:calc(var(--u)*36);height:38px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 12px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;z-index:2}
#stamp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:calc(var(--u)*24)}
#intro.logo #stamp{display:flex;animation:stamp 380ms ease-out both}
#stamp .mk{width:calc(var(--u)*120);height:calc(var(--u)*120);border-radius:50%;background:var(--ink);display:grid;place-items:center}
#stamp .mk svg{width:60%;height:60%}#stamp .mk path{fill:var(--cream)}
#stamp b{font-weight:800;font-size:calc(var(--u)*72);letter-spacing:.06em}
@keyframes stamp{0%{transform:scale(.72);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}

/* ---------- hero ---------- */
#flavors{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv)}
.rings{position:absolute;left:50%;top:41%;width:calc(var(--u)*2200);aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) calc(var(--u)*40),rgba(255,255,255,.13) calc(var(--u)*80));
  -webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);opacity:0}
.go .rings{animation:ringIn 1100ms ease-out forwards}
@keyframes ringIn{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.bits .bit{position:absolute;filter:blur(1.5px);opacity:0;translate:-50% -50%}
.go .bits .bit{animation:bitIn 900ms ease forwards}
@keyframes bitIn{to{opacity:.6}}
.bits .bit i{display:block;width:100%;animation:drift var(--dur) ease-in-out infinite alternate}
@keyframes drift{from{transform:none}to{transform:translate(var(--dx),calc(var(--dy)*-1)) rotate(var(--dr))}}
.arc{position:absolute;inset:0;z-index:4;touch-action:pan-y}
#title{position:absolute;left:0;right:0;top:calc(50% + var(--u)*265);transform:translateY(-50%);margin:0;text-align:center;font-size:calc(var(--u)*96);z-index:60;display:grid;padding:0 18px}
#title .tl{grid-area:1/1}
#title .w{display:inline-block;white-space:nowrap}
#title .l{display:inline-block}
#count{position:absolute;right:calc((100% - var(--u)*1440)/2 + var(--u)*28);top:calc(50% + var(--u)*215);font-size:calc(var(--u)*200);line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);z-index:1;opacity:0}
#play{position:absolute;left:50%;top:calc(50% + var(--u)*200);width:calc(var(--u)*52);height:calc(var(--u)*52);translate:-50% -50%;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);z-index:60;display:grid;place-items:center;opacity:0;transition:scale .2s}
#play svg{width:calc(var(--u)*18);height:calc(var(--u)*18);transition:transform .2s}
#play:hover{scale:1.08}#play:hover svg{transform:translateX(2px)}#play:active{scale:.94}
#auto{position:absolute;right:calc((100% - var(--u)*1440)/2 + var(--u)*40);top:calc(50% + var(--u)*170);z-index:60;display:flex;align-items:center;gap:10px;color:#fff;font:500 11px "DM Mono",monospace;letter-spacing:.14em;opacity:0}
#auto .ring{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center}
#auto svg{width:10px;height:10px;fill:#fff}
.go #play{animation:fadeIn 600ms 500ms ease forwards}
.go #count{animation:fadeIn 600ms 620ms ease forwards}
.go #auto{animation:fadeIn 600ms 740ms ease forwards}
@keyframes fadeIn{to{opacity:1}}

/* ---------- section 2 ---------- */
#inside{position:relative;height:500vh;background:var(--flav)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.in-dark{position:absolute;inset:0;background:#120d16;opacity:0}
.frame{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:center;transform:translate(-50%,-50%)}
.in-num{position:absolute;left:510px;top:240px;width:640px;text-align:center;font-size:428px;line-height:1;color:transparent;-webkit-text-stroke:1.6px #fff}
#inBar{position:absolute;left:665px;top:110px;width:330px;height:694px}
#inFront{position:fixed;left:0;top:0;width:100vw;height:100svh;z-index:3;pointer-events:none;display:none;will-change:transform}
.in-head{position:absolute;left:40px;top:300px;margin:0;font-size:88px;line-height:.93;color:var(--cream)}
.in-head span{display:block}
.in-icons{position:absolute;left:1292px;top:310px;display:grid;gap:4px;pointer-events:auto}
.in-icons button{width:66px;height:66px;border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;color:#fff;transition:background .3s,color .3s}
.in-icons button.on{background:var(--cream);color:var(--ink)}
.in-icons svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.in-cap{position:absolute;right:42px;top:596px;text-align:right;font:400 14px/1.5 "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92)}
#storm{position:absolute;inset:0}
#storm .spr{position:absolute;left:0;top:0;opacity:0;will-change:transform}

/* ---------- shop ---------- */

  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;

{ const r = rng(7);

const heroEl = $("#flavors"), insideEl = $("#inside"), shopEl = $("#shop"), rangeEl = $("#range");

/* ============================ intro ============================ */
const intro = $("#intro"), vid = $("#introVid"); let introDone = false, logoShown = false;

/* ============================ boot ============================ */

  await Promise.all([img.decode().catch(() => new Promise(r => { img.onload = r; img.onerror = r; })),
    document.fonts.load('400 40px "Archivo Black"'), document.fonts.load('400 14px "DM Mono"'), document.fonts.load('500 14px "DM Mono"'), document.fonts.load('700 14px Inter')]);

/* ============================ frame loop ============================ */
let last = performance.now(), inFrontOn = false, strip = false;
